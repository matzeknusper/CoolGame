name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to the "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Balance check (a bot plays all 60 levels)
        run: npm test

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/WuselWars.apk
          ls -la out dist

      - uses: actions/upload-artifact@v4
        with:
          name: WuselWars-apk
          path: out/WuselWars.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WuselWars-web
          path: dist
          if-no-files-found: error

      # Rolling pre-release so the newest APK always has a direct download link:
      # https://github.com/<owner>/<repo>/releases/tag/latest
      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/standalone.html out/WuselWars-web.html
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest out/WuselWars.apk out/WuselWars-web.html \
            --target "$GITHUB_SHA" --prerelease \
            --title "Wusel Wars – aktueller Build" \
            --notes "Automatischer Build von \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). **WuselWars.apk** auf dem Android-Gerät öffnen und installieren (Installation aus unbekannten Quellen erlauben). **WuselWars-web.html** ist das komplette Spiel als einzelne Datei für den Browser."
